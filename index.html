<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Commons Index: how Parliament really feels</title>
<meta name="description" content="Every question counted, every division tracked, every MP profiled. Computed nightly from the official parliamentary record.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFCF9; --panel:#FFFFFF; --border:#E3E1D8; --border-b:#141410;
  --text:#141410; --fg:#141410; --dim:#59594F; --faint:#8A887C;
  --violet:#1E45E2; --cyan:#3B6BC9; --hot:#D0330F; --warm:#B26F00; --cool:#1F9C97;
  --grad:#1E45E2;
  --disp:'Besley',Georgia,serif; --body:'Public Sans',system-ui,sans-serif; --mono:'Spline Sans Mono',monospace;
}
*{box-sizing:border-box;margin:0}
::selection{background:var(--violet);color:#fff}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Source Serif 4',Georgia,serif;
  font-size:16px;line-height:1.55;min-height:100vh;padding-bottom:60px;-webkit-font-smoothing:antialiased}
.banner{background:#FBEFDD;border-bottom:1px solid var(--warm);
  font:600 10.5px var(--mono);letter-spacing:1px;text-align:center;padding:7px 12px;color:var(--text)}
.wrap{max-width:1060px;margin:0 auto;padding:0 26px}

/* chrome */
.dateline{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--dim);
  padding:10px 0;border-bottom:1px solid var(--border)}
.dateline b{color:var(--text);font-weight:500}
header{padding:28px 0 0;text-align:center;border-bottom:3px solid var(--text)}
.masthead{font-family:var(--disp);font-weight:900;font-size:36px;letter-spacing:-.01em;line-height:1;color:var(--text)}
.masthead .stop{color:var(--hot)}
.strap{font-family:var(--body);font-weight:500;font-size:10.5px;letter-spacing:.26em;
  color:var(--dim);margin:8px 0 22px;text-transform:uppercase}
nav{display:flex;justify-content:center;gap:22px;padding:12px 0;flex-wrap:wrap;
  border-bottom:1px solid var(--border);margin-top:0}
nav button{font:600 13px var(--body);padding:8px 2px;border:none;border-bottom:2px solid transparent;
  cursor:pointer;background:transparent;color:var(--dim);transition:.12s}
nav button:hover,nav button:focus-visible{color:var(--text);outline:none}
nav button.on{color:var(--text);border-bottom-color:var(--violet)}
main{margin-top:30px}

/* shared */
.panel{background:transparent;border:none;border-top:3px solid var(--text);padding:18px 0 8px;animation:none}
.panel + .panel{margin-top:26px}
.label{font:700 11px var(--body);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.grid{display:grid;gap:14px 44px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:none}
.pdot{font:700 10px var(--body);padding:2px 8px;border-radius:2px;flex-shrink:0}
.bar{height:6px;background:var(--border);flex:1;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.hot{color:var(--hot)} .cool{color:var(--cool)} .warm{color:var(--warm)}
.big{font:800 26px var(--disp)}
.search{width:100%;font:14.5px var(--body);padding:11px 14px;border:1.5px solid var(--text);
  background:#fff;color:var(--text);outline:none}
.search:focus{outline:2px solid var(--violet);outline-offset:1px}
.chip{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  font:600 12px var(--body);border-radius:2px;margin-left:4px}
.mplist{max-height:520px;overflow-y:auto;padding:0;border:1px solid var(--border);background:#fff;margin-top:10px}
.mpbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
  gap:8px;padding:9px 12px;border:none;border-bottom:1px solid var(--border);cursor:pointer;background:transparent;
  color:var(--dim);font:13.5px var(--body);transition:.1s}
.mpbtn:hover{background:#F8F6F0;color:var(--text)}
.mpbtn.on{background:var(--text);color:var(--bg)}
.stat{background:transparent;border:none;border-top:1px solid var(--border);padding:12px 0 8px}
.stat .n{font:800 26px var(--disp)}
.stat .l{font:600 10px var(--body);letter-spacing:.06em;color:var(--dim);margin-top:4px;text-transform:uppercase}
.tip{cursor:help;border-bottom:1px dotted var(--faint)}
footer{margin-top:44px;font-size:12.5px;color:var(--dim);line-height:1.7;max-width:860px;
  border-top:3px solid var(--text);padding-top:16px}
footer a{color:var(--violet)}
*::-webkit-scrollbar{width:8px}*::-webkit-scrollbar-thumb{background:#CFCDC2;border-radius:4px}
.empty{padding:60px 20px;text-align:center;color:var(--dim);font:15px var(--body)}
.growth{font:700 15px var(--mono)}
spark{display:inline-block}
.hrow{border-top:1px solid var(--border);padding:16px 2px}
.hrow .top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hscore{font:800 26px var(--disp);min-width:64px;text-align:right}
.hrank{font:600 11px var(--mono);color:var(--faint);min-width:22px;text-align:right}
.hissue{font:700 17px var(--disp)}
.hverdict{font-size:14.5px;color:var(--dim);margin:4px 0 0 100px;max-width:720px}
.hmeta{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tchip{font:600 10px var(--body);padding:3px 8px;border-radius:2px;border:1px solid;letter-spacing:.03em;text-transform:uppercase}
.pill{font:600 12px var(--body);padding:7px 14px;border-radius:0;border:1.5px solid var(--border);
  background:transparent;color:var(--dim);cursor:pointer;transition:.12s}
.pill:hover{border-color:var(--text);color:var(--text)}
.pill.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.receipt{border-left:2px solid var(--violet);padding:6px 12px;margin:8px 0 8px 100px;font-size:14px;color:var(--dim);font-style:italic}
.receipt b{color:var(--text);font-weight:600;font-style:normal}
@media(max-width:700px){.hverdict,.receipt{margin-left:0}}

/* bills */
.bstage{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border:1px solid var(--border);color:var(--dim);white-space:nowrap}
.bstage.act{border-color:var(--cool);color:var(--cool)}
.brow{border-top:1px solid var(--border);padding:16px 2px;cursor:pointer;transition:background .12s}
.brow:hover{background:#F8F6F0}
.bsec{border-top:1px solid var(--border);padding:18px 0 12px;margin-top:8px}
.jstep{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--border);font-size:13.5px}
.jdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;align-self:center}
.jdot.done{background:var(--text)}
.jdot.current{background:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 25%,transparent)}
.jdot.upcoming{background:transparent;border:1.5px solid var(--faint)}
.jhouse{font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase;min-width:64px}
.arung{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:13.5px;flex-wrap:wrap}
.abadge{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;min-width:120px;text-align:center}
.abar{height:7px;background:var(--grad);display:inline-block;vertical-align:middle}
.ask{border-top:1px solid var(--border);padding:11px 0}
.moodrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--border);flex-wrap:wrap}

/* welcome */
.fp-hero{padding:44px 0 26px;text-align:center;border-bottom:none}
.fp-kick{font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.fp-thesis{font-family:var(--disp);font-weight:800;font-size:clamp(38px,6vw,60px);
  line-height:1.03;letter-spacing:-.015em;margin-top:16px}
.fp-thesis em{font-style:italic;font-weight:600;color:var(--violet)}
.fp-stand{margin:22px auto 0;font-size:18px;line-height:1.55;color:var(--dim);max-width:56ch}
.figure{border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:28px 0 22px;margin-top:30px}
.fig-title{font:700 12.5px var(--body)}
.chamber-svg{width:100%;height:auto;display:block;margin-top:6px}
.bench-lab{font-family:var(--body);font-size:10px;letter-spacing:.14em;fill:var(--dim)}
.fig-cap{margin-top:10px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:500 11px var(--body);color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.fig-note{font-size:13px;font-style:italic;color:var(--dim)}
.findings{display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px;margin-top:16px}
@media(max-width:820px){.findings{grid-template-columns:1fr}}
.finding{display:block;text-align:left;background:none;border:none;border-top:3px solid var(--text);
  padding:14px 0 20px;cursor:pointer;font:inherit;color:inherit;transition:background .12s}
.finding:hover{background:#F8F6F0}
.finding:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.f-kick{display:block;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.f-num{display:block;font-family:var(--disp);font-weight:800;font-size:36px;line-height:.9;margin-top:12px;letter-spacing:-.02em}
.f-line{display:block;font-size:15px;line-height:1.5;margin-top:10px}
.f-go{display:block;font:700 12px var(--body);color:var(--violet);margin-top:12px}

/* newsletter slab */
.feature{background:var(--violet);color:#fff;padding:44px 42px;margin:44px 0 0}
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center;max-width:860px;margin:0 auto}
.f-copy h2{font-family:var(--disp);font-weight:800;font-size:25px;line-height:1.1;letter-spacing:-.01em;color:#fff}
.f-copy p{margin-top:13px;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.85);max-width:44ch}
.f-copy .cta{display:inline-block;margin-top:20px;font:700 13px var(--body);
  color:var(--violet);background:#fff;text-decoration:none;padding:12px 22px}
.f-card{border:1px solid rgba(255,255,255,.35);padding:26px 28px 22px}
.f-card .kicker{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#F2A93C}
.f-card h3{font-family:var(--disp);font-size:23px;font-weight:800;line-height:1.1;margin-top:9px;color:#fff}
.f-card p{margin-top:12px;font-size:14px;color:rgba(255,255,255,.75)}
@media(max-width:820px){.feature{padding:30px 20px}.feature-grid{grid-template-columns:1fr;gap:24px}}
</style>
</head>
<body>
<div class="banner" id="banner" style="display:none">SAMPLE DATA. The engine has not run yet. Run the Backfill workflow on GitHub, then refresh.</div>
<div class="wrap">
  <div class="dateline">
    <span id="dl-date"><b></b></span>
    <span>Computed nightly from the official record · Est. 2026</span>
  </div>
  <header>
    <div class="masthead">The Commons Index<span class="stop">.</span></div>
    <div class="strap">What is Parliament talking about?</div>
    <nav id="nav"></nav>
  </header>
  <main id="main"><div class="empty">Loading the record…</div></main>
  <footer id="foot"></footer>
</div>

<script>
const PARTY = {Lab:"#C8321B",Con:"#1F53B0",LD:"#C97F04",RUK:"#0E8A99",Ref:"#0E8A99",
  SNP:"#A08A00",Green:"#2E7D32",PC:"#1F8A5B",DUP:"#8E4A63",SF:"#2F7D4F",SDLP:"#5E9444",
  Alliance:"#B08F1E",UUP:"#5C7FB8",TUV:"#6E86A8",APNI:"#B08F1E",YP:"#7A6A9E",RB:"#7A6A9E",Ind:"#8A887C",Spk:"#8A887C"};
const pcol = p => PARTY[p] || "#8A887C";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let DATA = {}, tab = "home", selMP = null, query = "", selDept = "";
let heatWin = "fortnight", heatBench = "all", heatOpen = -1;
let selBill = null, billArchive = false;

const TABS = [["home","Welcome"],["heat","Heat board"],["bills","Bills"],["policy","Policy areas"],["mps","MP intelligence"],["leagues","League tables"],["momentum","Momentum"],["about","About"]];

async function boot(){
  const dl = document.querySelector("#dl-date b");
  if(dl) dl.textContent = new Date().toLocaleDateString("en-GB",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
  const files = ["meta","mps","topics","leagues","heat","sentiment","bills"];
  for (const f of files){
    try { DATA[f] = await (await fetch(`data/${f}.json?v=${Date.now()}`)).json(); }
    catch(e){ DATA[f] = null; }
  }
  if (DATA.meta?.sample) document.getElementById("banner").style.display = "block";
  document.getElementById("nav").innerHTML = TABS.map(([k,l]) =>
    `<button data-t="${k}" class="${k===tab?"on":""}">${l}</button>`).join("");
  document.getElementById("nav").onclick = e => {
    const t = e.target.dataset.t; if(!t) return; tab = t; renderNav(); render();
  };
  renderFoot(); render();
}
function renderNav(){
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.t === tab));
}
function pdot(p){ const c = pcol(p);
  return `<span class="pdot" style="color:${c};border:1px solid ${c}44;background:${c}14">${esc(p)}</span>`; }
function spark(values, color){
  if(!values?.length) return "";
  const W=120,H=30,max=Math.max(...values,1),min=Math.min(...values,0);
  const pts = values.map((v,i)=>`${(i/(Math.max(1,values.length-1)))*W},${H-((v-min)/Math.max(1,max-min))*(H-6)-3}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`;
}



/* ---------- POLICY AREAS ---------- */

/* ---------- WELCOME ---------- */
const NEWS_SLAB = `<div class="feature"><div class="feature-grid">
  <div class="f-copy"><h2>The weekly newsletter</h2>
    <p>Each week the newsletter takes one finding from this data and explains what it means, with the quotes that prove it. Free, on LinkedIn.</p>
    <a class="cta" href="https://www.linkedin.com/newsletters/the-commons-index-7472042334084579328/" target="_blank" rel="noopener">Read the newsletter</a></div>
  <div class="f-card"><div class="kicker">The Commons Index</div>
    <h3>The numbers behind the noise.</h3>
    <p>One finding from the data each week, explained in plain English with the quotes to back it up.</p></div>
</div></div>`;

function mpTone(id){
  const tn = DATA.sentiment?.mps?.[String(id)]?.c?.tn;
  if(!tn) return 0;
  const tot = (tn.heated||0)+(tn.impassioned||0)+(tn.concerned||0)+(tn.measured||0)+(tn.warm||0);
  if(!tot) return 0;
  return ((tn.heated||0)*3 + (tn.impassioned||0)*2 + (tn.concerned||0)) / tot;
}
function seatCol(s){
  return s>=0.9 ? ["#D0330F",4.8] : s>=0.45 ? ["#E8930C",4.2] : s>=0.15 ? ["#AABDE8",3.6] : ["#D9DFEF",3.6];
}
function chamberSVG(){
  const mps = DATA.mps || [];
  if(!mps.length) return "";
  const W=1000, H=320, aisleX=W/2, aisleHalf=46;
  const govParty = DATA.heat?.gov_party || "Lab";
  const members = mps.filter(m => m.party !== "Spk");
  const gov = members.filter(m => m.party === govParty);
  const opp = members.filter(m => m.party !== govParty);
  let dots = "";
  function bank(list, side){
    const rows=8, topY=58, rowGap=27;
    const perRow = Math.ceil(list.length/rows);
    const avail = aisleX - aisleHalf - 18 - 16 - rows*3;
    const dx = Math.min(11, avail / Math.max(perRow-1, 1));
    let i = 0;
    for(let r=0; r<rows && i<list.length; r++){
      const y = topY + r*rowGap + (side===1 ? 5 : 0);
      for(let k=0; k<perRow && i<list.length; k++, i++){
        const x = aisleX + side*(aisleHalf + 18 + k*dx + r*3);
        const m = list[i];
        const c = seatCol(mpTone(m.id));
        dots += `<circle cx="${x.toFixed(1)}" cy="${y}" r="${c[1]}" fill="${c[0]}"><title>${esc(m.name)} (${esc(m.party)})</title></circle>`;
      }
    }
  }
  bank(gov, -1);
  bank(opp, 1);
  return `<svg class="chamber-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="The House of Commons, each dot an MP coloured by how strongly they have spoken">
    <rect x="${aisleX-12}" y="8" width="24" height="18" rx="2" fill="none" stroke="#59594F" stroke-width="1.2"/>
    <text x="${aisleX}" y="40" text-anchor="middle" class="bench-lab">SPEAKER</text>
    <line x1="${aisleX-aisleHalf}" y1="44" x2="${aisleX-aisleHalf}" y2="${H-26}" stroke="#E3E1D8" stroke-width="1"/>
    <line x1="${aisleX+aisleHalf}" y1="44" x2="${aisleX+aisleHalf}" y2="${H-26}" stroke="#E3E1D8" stroke-width="1"/>
    <text x="${aisleX-aisleHalf-8}" y="${H-8}" text-anchor="end" class="bench-lab">GOVERNMENT · ${gov.length}</text>
    <text x="${aisleX+aisleHalf+8}" y="${H-8}" text-anchor="start" class="bench-lab">OPPOSITION · ${opp.length}</text>
    ${dots}</svg>`;
}
function renderHome(){
  const iss = (DATA.heat?.fortnight?.issues || [])[0];
  const riser = (DATA.topics || []).find(t => t.topic && t.topic.toLowerCase() !== "unclassified" && t.growth != null && t.growth > 0);
  const escal = (DATA.sentiment?.leagues?.escalators || [])[0];
  const go = t => `tab='${t}';renderNav();render();window.scrollTo({top:0})`;
  const findings = [];
  if(iss) findings.push(`<button class="finding" onclick="${go('heat')}">
    <span class="f-kick">The most charged issue</span>
    <span class="f-num" style="color:${heatColor(iss.heat)}">${iss.heat.toFixed(2)}</span>
    <span class="f-line"><b>${esc(iss.issue)}</b> — the strongest feeling in the House right now, from ${iss.n} contributions.</span>
    <span class="f-go">Heat board →</span></button>`);
  if(riser) findings.push(`<button class="finding" onclick="${go('momentum')}">
    <span class="f-kick">The fastest-growing subject</span>
    <span class="f-num" style="color:var(--cool)">▲${riser.growth}%</span>
    <span class="f-line"><b>${esc(riser.topic)}</b> — attention has grown fastest here this quarter.</span>
    <span class="f-go">Momentum →</span></button>`);
  if(escal) findings.push(`<button class="finding" onclick="${go('mps')}">
    <span class="f-kick">The biggest change in tone</span>
    <span class="f-num" style="color:var(--warm)">${esc(escal.v)}</span>
    <span class="f-line"><b>${esc(escal.name)}</b> — speaking with markedly more force than earlier in the year.</span>
    <span class="f-go">MP intelligence →</span></button>`);
  const W = DATA.heat?.fortnight;
  return `<div class="fp-hero">
      <span class="fp-kick">This week in the Commons</span>
      <h1 class="fp-thesis">How Parliament <em>really feels.</em></h1>
      <p class="fp-stand">The Commons Index reads everything MPs say in the House of Commons and measures the sentiment behind it: what each MP was arguing for, and how strongly they felt when they said it. Every judgment is backed by a direct quote from the official record, so you can check it yourself.</p>
    </div>
    <div class="figure">
      <span class="fig-title">The House of Commons right now. Each dot is an MP, coloured by how strongly they have spoken in recent debates${W ? ` (${esc(W.from)} to ${esc(W.to)})` : ""}.</span>
      ${chamberSVG() || '<div class="empty">The chamber picture appears after the next nightly run.</div>'}
      <div class="fig-cap">
        <div class="legend">
          <span><i style="background:#D9DFEF"></i> Measured</span>
          <span><i style="background:#AABDE8"></i> Concerned</span>
          <span><i style="background:#E8930C"></i> Impassioned</span>
          <span><i style="background:#D0330F"></i> Heated</span>
        </div>
        <span class="fig-note">Most MPs speak calmly most of the time, so the House mostly shows pale. The red dots are the MPs who didn't — and they are usually where the story is.</span>
      </div>
    </div>
    ${findings.length ? `<div class="findings">${findings.join("")}</div>` : ""}
    ${NEWS_SLAB}`;
}

function renderPolicy(){
  const H = DATA.heat;
  const W = H?.[heatWin];
  if(!W?.areas?.length) return `<div class="panel"><div class="empty">No policy data yet. It appears after the next nightly run.</div></div>`;
  const cards = W.areas.map((a,i) => `
    <div class="panel">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">

/* ---------- HEAT BOARD ---------- */
const TONE_STYLE = {heated:"--hot", impassioned:"--warm", concerned:"--cyan", measured:"--dim", warm:"--cool"};
const HEAT_W_JS = {heated:3, impassioned:2, concerned:1, measured:0, warm:0};

function computeHeatRows(board, bench){
  /* Pure: takes the baked issue list and a bench key ("all"|"gb"|"opp"),
     returns rows recomputed and re-sorted for that bench. */
  if(!board) return [];
  if(bench === "all")
    return board.map(it => ({...it, vN: it.n, vHeat: it.heat}));
  return board
    .map(it => {
      const b = (it.bench||{})[bench];
      if(!b || b[0] < 5) return null;           /* bench floor: 5 */
      return {...it, vN: b[0], vHeat: Math.round(100*b[1]/b[0])/100};
    })
    .filter(Boolean)
    .sort((a,b) => b.vHeat - a.vHeat || b.vN - a.vN);
}

function heatColor(h){ return h >= 1 ? "var(--hot)" : h >= 0.5 ? "var(--warm)" : "var(--dim)"; }

function trendBadge(t){
  if(t === null || t === undefined) return `<span class="faint mono" style="font-size:10px">NEW</span>`;
  if(t > 0.05)  return `<span class="hot mono" style="font-size:11px">&#9650; +${t.toFixed(2)}</span>`;
  if(t < -0.05) return `<span class="cool mono" style="font-size:11px">&#9660; ${t.toFixed(2)}</span>`;
  return `<span class="faint mono" style="font-size:10px">STEADY</span>`;
}

function toneChips(tones){
  return ["heated","impassioned","concerned"].filter(t => tones?.[t])
    .map(t => `<span class="tchip" style="color:var(${TONE_STYLE[t]});border-color:currentColor">${tones[t]} ${t}</span>`)
    .join("");
}

const STANCE_META = [["supporting","Backing the government","var(--warm)"],
  ["pushing further","Pushing it to go further","var(--violet)"],
  ["opposing","Opposing","var(--hot)"],
  ["seeking","Asking questions","var(--cool)"],
  ["constituency","Raising local cases","var(--dim)"]];

function stanceBar(st, n){
  if(!st || !n) return "";
  const tip = STANCE_META.filter(([k])=>st[k]>0)
    .map(([k,lbl])=>`${lbl}: ${Math.round(100*st[k]/n)}%`).join("  ·  ");
  const segs = STANCE_META.filter(([k])=>st[k]>0)
    .map(([k,,col])=>`<i style="display:block;height:100%;float:left;width:${100*st[k]/n}%;background:${col}"></i>`).join("");
  return `<span class="tip" title="What speakers were doing. ${tip}" style="width:92px;height:7px;border-radius:99px;overflow:hidden;display:inline-block;background:var(--border);vertical-align:middle">${segs}</span>`;
}

function stanceChips(st, n){
  if(!st || !n) return "";
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px 100px">
    ${STANCE_META.filter(([k])=>st[k]>0)
      .map(([k,lbl,col])=>`<span class="mono" style="font-size:10px;padding:3px 9px;border-radius:99px;color:${col};background:color-mix(in srgb,${col} 10%,transparent);border:1px solid color-mix(in srgb,${col} 35%,transparent)">${lbl} ${Math.round(100*st[k]/n)}%</span>`).join("")}
  </div>`;
}

    </div>

}


/* ---------- BILLS ---------- */
const STAGE_ABBR = [["1st reading","1R"],["2nd reading","2R"],["3rd reading","3R"],
  ["Committee of the whole House","Cttee"],["Committee stage","Cttee"],["Report stage","Report"],
  ["Programme motion","Prog"],["Money resolution","Money"],["Ways and Means resolution","W&M"],
  ["Carry-over motion","C/O"],["Bill reintroduced","Reintro"],["Consideration of Lords amendments","LA"],
  ["Consideration of Commons amendments","CA"],["Royal Assent","RA"]];
function stageAbbr(s){ const m = STAGE_ABBR.find(([k])=>s.startsWith(k)); return m ? m[1] : s.split(" ")[0]; }

function billTimeline(b){
  const tl = b.timeline||[], mk = (b.markers||[]).filter(m=>m.h==="Commons");
  if(!tl.length) return "";
  const ds = tl.map(t=>Date.parse(t.d)).concat(mk.map(m=>Date.parse(m.d)));
  const lo = Math.min(...ds), hi = Math.max(...ds, lo + 864e5);
  const W=860, H=150, P=14, plotH=92, baseY=118;
  const X = d => P + (Date.parse(d)-lo)/(hi-lo)*(W-2*P);
  const lastAct = tl[tl.length-1].d;
  const lastX = [-99,-99];
  const marks = mk.map((m,i)=>{
    const x=X(m.d), fut = m.d > lastAct;
    // two label rows, and a label is dropped rather than allowed to
    // collide with its neighbour; the dashed stage line always stays
    let row = (x - lastX[0] >= 40) ? 0 : (x - lastX[1] >= 40) ? 1 : -1;
    const ly = row===1 ? 24 : 11;
    if(row>=0) lastX[row] = x;
    const line = `<line x1="${x}" y1="${row<0?4:ly+4}" x2="${x}" y2="${baseY}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3" opacity="${fut?0.55:1}"><title>${esc(m.s)} · ${esc(m.d)}</title></line>`;
    if(row<0) return line;
    return line + `<text x="${x}" y="${ly}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--${fut?'faint':'dim'})">${esc(stageAbbr(m.s))}${fut?" ·":""}<title>${esc(m.s)} · ${esc(m.d)}</title></text>`;
  }).join("");
  const bars = tl.map(t=>{
    const x=X(t.d), hgt=Math.max(2,(t.heat/3)*plotH);
    return `<rect x="${x-2}" y="${baseY-hgt}" width="4" height="${hgt}" fill="${t.heat>=1?"var(--hot)":t.heat>=0.5?"var(--warm)":"var(--dim)"}"><title>${esc(t.d)} · ${t.n} contributions · heat ${t.heat.toFixed(2)}</title></rect>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${P}" y1="${baseY}" x2="${W-P}" y2="${baseY}" stroke="var(--border-b)" stroke-width="1.5"/>
    ${marks}${bars}
    <text x="${P}" y="${H-6}" font-family="var(--mono)" font-size="9.5" fill="var(--faint)">${esc(tl[0].d)}</text>
    <text x="${W-P}" y="${H-6}" text-anchor="end" font-family="var(--mono)" font-size="9.5" fill="var(--faint)">${esc(mk.length&&mk[mk.length-1].d>lastAct?mk[mk.length-1].d+" (listed)":lastAct)}</text>
  </svg>`;
}

      <button class="pill ${billArchive?"":"on"}" onclick="billArchive=false;render()">Before Parliament now (${B.bills.length-nLaw})</button>

function renderBillDetail(b, B){

  const AM = b.amendments||{}, CM = AM.commons||{}, LD = AM.lords||{};

  const decLine = Object.entries(CM.decided||{}).map(([k,v])=>`${v} ${(DEC[k]||[k])[0].toLowerCase()}`).join(", ");
  return `<div class="panel">

    <div class="bsec"><div class="label">What they are trying to change</div>
      ${CM.n?`<p class="dim" style="font-size:12px;max-width:720px;margin:2px 0 10px">The ${CM.n} amendment${CM.n===1?"":"s"} tabled in the Commons, read for signatures rather than counts. Most amendments are never moved or voted on, so the number of members who put their name to one is the better measure of what has support. Where Parliament gives an amendment a title, that title is used; where it publishes only a drafting instruction, the ask is summarised in one sentence and the original is on hover.${decLine?" Of those decided: "+decLine+".":""}</p>${asks}`:`<div class="faint" style="font-size:12.5px">No Commons amendments on record for this bill yet.</div>`}
      ${LD.n?`<div class="faint" style="font-size:11.5px;margin-top:12px">The Lords have tabled ${LD.n} amendments to this bill. The Commons Index does not score speech in the Lords, so their debate is not read here, but Lords amendments return to this House for a decision and that debate is scored above.</div>`:""}
    </div>
    ${rebels?`<div class="bsec"><div class="label">Government backbenchers putting their names to amendments</div>
      <p class="dim" style="font-size:12px;max-width:720px;margin:2px 0 10px">Signatures from the governing party&rsquo;s own backbenches, on amendments their frontbench did not table. Names on paper are not votes, and many of these amendments are never pressed, but this is where pressure becomes visible before a division.</p>${rebels}</div>`:""}
    <div class="faint" style="font-size:11px;margin-top:14px;line-height:1.6">Built from every classified contribution in Commons debates matched to this bill on Parliament&rsquo;s official record, with stages and amendments from Parliament&rsquo;s Bills API. Public Bill Committee sittings are not yet read by the engine, so a committee stage can show its marker with no scored contributions beneath it. Counts are floors, not totals. Behind every judgment sits a verbatim quote.</div>
  </div>`;
}

/* ---------- MOMENTUM ---------- */
function renderMomentum(){

  if(!t?.length) return `<div class="empty">No topic data yet. Run the backfill on GitHub.</div>`;
  return `<div class="grid" style="gap:12px">
    <p class="dim" style="font-size:12.5px;max-width:760px">
      Ranked by <span class="tip" title="Questions in the last ~90 days versus the previous ~90 days">growth, not size</span>.
      The biggest subjects are always big. This page shows what's suddenly getting attention instead.</p>
    ${t.map((x,i)=>`
    <div class="panel">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px">
        <div style="display:flex;align-items:baseline;gap:10px;min-width:0">
          <span class="mono faint" style="font-size:12px">${String(i+1).padStart(2,"0")}</span>
          <span style="font:700 17px var(--disp)">${esc(x.topic)}</span>
          <span class="faint" style="font-size:11px">→ ${esc(x.body)}</span>
        </div>
        <span class="growth ${x.growth==null?"dim":x.growth>=0?"cool":"hot"}">
          ${x.growth==null?"NEW":(x.growth>=0?"▲ ":"▼ ")+Math.abs(x.growth)+"%"}</span>
      </div>
      ${x.qcur!=null?`<div class="faint" style="font:500 11px var(--mono);margin-top:6px">${x.qcur} written questions · ${x.dcur||0} debate contributions</div>`:""}
      ${x.gloss?`<div style="font-size:13px;color:var(--dim);margin-top:8px;font-style:italic;max-width:720px">${esc(x.gloss)}
        <span class="tip faint" style="font-style:normal" title="AI-written summary of what the underlying questions are probing, generated nightly from sample question texts. Counts and rankings are never AI-derived.">ⓘ</span></div>`:""}
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <span class="mono faint" style="font-size:10px;width:64px">PREV QTR</span>
        <div class="bar"><i style="width:${Math.min(100,100*x.prev/Math.max(x.cur,x.prev,1))}%;background:#3A4458"></i></div>
        <span class="mono dim" style="font-size:11px;width:36px;text-align:right">${x.prev}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
        <span class="mono faint" style="font-size:10px;width:64px">THIS QTR</span>
        <div class="bar"><i style="width:${Math.min(100,100*x.cur/Math.max(x.cur,x.prev,1))}%"></i></div>
        <span class="mono" style="font-size:11px;width:36px;text-align:right">${x.cur}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center">
        ${x.parties.map(([p,v])=>pdot(p)+`<span class="mono faint" style="font-size:10px;margin-right:6px">${v}%</span>`).join("")}
        <span class="faint" style="font-size:11px;margin-left:auto">leading:
          ${x.askers.slice(0,3).map(a=>esc(a.name)+" ("+a.n+")").join(" · ")}</span>
      </div>
    </div>`).join("")}
  </div>`;
}

/* ---------- MPs ---------- */
function renderMPs(){
  const mps = DATA.mps;
  if(!mps?.length) return `<div class="empty">No MP data yet. Run the backfill on GitHub.</div>`;
  const q = query.toLowerCase();
  const list = mps.filter(m => !q || m.name.toLowerCase().includes(q) ||
    (m.seat||"").toLowerCase().includes(q) || (m.party||"").toLowerCase()===q);
  if(selMP==null || !mps.find(m=>m.id===selMP)) selMP = (list[0]||mps[0]).id;
  const mp = mps.find(m=>m.id===selMP) || mps[0];
  const c = pcol(mp.party);
  const ratio = (mp.rebellions / Math.max(.5, mp.partyAvgReb)).toFixed(1);
  const chips = (mp.form||[]).map(v=>{
    const m={W:["✓","var(--cool)"],R:["✗","var(--hot)"],A:["–","var(--warm)"]}[v]||["?","var(--dim)"];
    const t={W:"Voted with party majority",R:"Voted against party majority",A:"Did not vote"}[v]||"";
    return `<span class="chip" title="${t}" style="color:${m[1]};background:color-mix(in srgb,${m[1]} 12%,transparent);border:1px solid color-mix(in srgb,${m[1]} 40%,transparent)">${m[0]}</span>`;
  }).join("");
  return `<p class="dim" style="font-size:12.5px;max-width:760px;margin-bottom:12px">One card per MP: what they pursue in written questions, when they vote against their own party, and how they actually sound in debate. Every claim carries a verbatim quote; hover to see it.</p><div class="grid" style="grid-template-columns:280px 1fr;align-items:start">
    <div>
      <input class="search" placeholder="Search ${mps.length} MPs, seats, parties…" value="${esc(query)}"
        oninput="query=this.value;render(true)">
      <div class="mplist panel" style="margin-top:10px;padding:8px">
        ${list.slice(0,400).map(m=>`
          <button class="mpbtn ${m.id===selMP?"on":""}" onclick="selMP=${m.id};render()">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}</span>
            ${pdot(m.party)}
          </button>`).join("") || `<div class="empty" style="padding:20px">No match</div>`}
      </div>
    </div>
    <div class="panel" style="border-top:2px solid ${c}">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-start">
        <div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font:700 24px var(--disp)">${esc(mp.name)}</span>${pdot(mp.party)}
          </div>
          <div class="dim" style="font-size:12.5px;margin-top:4px">${esc(mp.seat)}</div>
          <div style="font:600 10.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;margin-top:6px;color:${mp.role?"var(--violet)":"var(--faint)"}">
            ${esc(mp.role || "Backbencher")}</div>
        </div>
        <div style="text-align:right">
          <div class="label" style="margin-bottom:6px">Last six divisions</div>
          ${chips || '<span class="faint" style="font-size:11px">no votes recorded</span>'}
        </div>
      </div>
      <div class="grid" style="margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <div class="stat"><div class="n ${mp.rebellions>0&&ratio>=2?"hot":""}">${mp.rebellions}</div>
          <div class="l"><span class="tip" title="Votes cast against the majority of their own party, in divisions where that party voted as a bloc (≥85% one way, ≥10 voting). Free and conscience votes fall below this bar and are excluded by design">REBELLIONS</span> · ${ratio}× PARTY AVG</div></div>
        <div class="stat"><div class="n">${mp.participation}%</div>
          <div class="l"><span class="tip" title="Share of all Commons divisions this parliament in which they cast a vote">DIVISION PARTICIPATION</span></div></div>
        <div class="stat"><div class="n">${(mp.spoken||0).toLocaleString()}</div>
          <div class="l"><span class="tip" title="Spoken contributions recorded in Hansard this parliament: speeches, interventions and oral answers">SPOKEN CONTRIBUTIONS</span></div></div>
        <div class="stat"><div class="n">${mp.questions}</div>
          <div class="l"><span class="tip" title="Written parliamentary questions tabled this parliament">WRITTEN QUESTIONS</span></div>
          <div style="margin-top:6px">${spark(mp.spark, c)}</div></div>
      </div>
      <div style="margin-top:26px;padding-top:14px;border-top:2px solid var(--border)"><div style="font:700 12px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--violet)">In the chamber</div><div class="faint" style="font-size:11.5px;margin-top:2px">What they say out loud in debate, and how strongly they say it. Every reading is backed by a real quote; hover a line to read it.</div></div>
      ${(() => {
        const tr = DATA.sentiment?.mps?.[String(mp.id)];
        if(!tr?.t?.length) return "";
        const live = tr.t.filter(x => x[1] > 0);
        if(live.length < 2) return "";
        const MN = {"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Oct","11":"Nov","12":"Dec"};
        const last = live[live.length-1][2];
        const col = last >= 1 ? "var(--hot)" : last >= 0.5 ? "var(--warm)" : "var(--cool)";
        return `<div style="margin-top:18px">
          <div class="label">How their tone is changing
            <span class="tip faint" title="Everything this MP says in debate is scored each month for how strongly it was said. An angry contribution scores highest, an anguished or worried one sits in the middle, and routine businesslike remarks score zero. The line shows the monthly average, so you can see at a glance whether they are getting more worked up or calming down. Months where they barely spoke count for little.">AI &#9432;</span></div>
          <div style="display:flex;align-items:center;gap:12px;margin-top:6px">
            ${spark(tr.t.map(x=>x[2]), col)}
            <span style="font-size:12.5px" class="dim">${esc(tr.s || "")}
              <span class="faint">&middot; ${MN[live[0][0]]} to ${MN[live[live.length-1][0]]}</span></span>
          </div>

      })()}
      ${mp.said?`
      <div style="margin-top:18px">
        <div class="label">How they're speaking · last 6 months
          <span class="tip faint" title="AI-read nightly from their full debate contributions, each judged in the context of its whole exchange. Stance is measured against the government position, never the previous speaker: supporting, pushing further (backs the direction but demands more), opposing, seeking (genuinely asking), constituency (local case). Tone is judged independently; measured is the default and heat must be earned. Every line carries a verbatim quote; hover to see it.">AI ⓘ</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
          ${[["supporting","Supporting","var(--warm)"],["pushing further","Pushing further","var(--violet)"],["opposing","Opposing","var(--hot)"],["seeking","Seeking","var(--cool)"],["constituency","Constituency","var(--dim)"]]
            .filter(([k])=>((DATA.sentiment?.mps?.[String(mp.id)]?.c?.st) || mp.said.stance)[k]>0)
            .map(([k,lbl,col])=>`<span class="mono" style="font-size:10px;padding:3px 9px;border-radius:99px;color:${col};background:color-mix(in srgb,${col} 10%,transparent);border:1px solid color-mix(in srgb,${col} 35%,transparent)">${lbl} ${((DATA.sentiment?.mps?.[String(mp.id)]?.c?.st) || mp.said.stance)[k]}</span>`).join("")}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
          ${[["heated","Heated","var(--hot)"],["impassioned","Impassioned","var(--violet)"],["concerned","Concerned","var(--warm)"],["measured","Measured","var(--dim)"],["warm","Warm","var(--cool)"]]
            .filter(([k])=>((DATA.sentiment?.mps?.[String(mp.id)]?.c?.tn) || mp.said.tone)[k]>0)
            .map(([k,lbl,col])=>`<span class="mono" style="font-size:10px;padding:3px 9px;border-radius:99px;color:${col};background:color-mix(in srgb,${col} 10%,transparent);border:1px solid color-mix(in srgb,${col} 35%,transparent)">${lbl} ${((DATA.sentiment?.mps?.[String(mp.id)]?.c?.tn) || mp.said.tone)[k]}</span>`).join("")}
        </div>
        ${(mp.said.recent||[]).map(r=>`
          <div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px"
               title="&ldquo;${esc(r.q)}&rdquo;">
            <span class="mono faint" style="flex-shrink:0">${esc(r.d)}</span>
            <span style="min-width:0"><b>${esc(r.issue)}</b>
              <span class="mono faint" style="font-size:10px"> ${esc(r.stance)} · ${esc(r.tone)}</span>
              <span class="dim">&middot; ${esc(r.sum)}</span></span>
          </div>`).join("")}
        <div class="faint" style="font-size:11px;margin-top:6px">Their five most recent readings. The counts above cover everything they have said in debate over that whole period, from the full record.</div>
      </div>`:""}
      ${(mp.speaking||[]).length?`
      <div style="margin-top:18px">
        <div class="label">Speaking on &middot; ${esc(DATA.sentiment?.span || "last 6 months")}
          <span class="tip faint" title="Debate sections in the Commons Chamber and Westminster Hall where they spoke most, by contribution count. Topics are AI-mapped from section titles; the counts are pure arithmetic.">ⓘ</span></div>
        ${mp.speaking.map(([t,n],i)=>`
          <div style="display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--border);font-size:13px">
            <span class="mono faint" style="font-size:11px">0${i+1}</span>
            <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</span>
            <span class="mono faint" style="font-size:11px;margin-left:auto;flex-shrink:0">${n} contributions</span>
          </div>`).join("")}
      </div>`:""}
      <div style="margin-top:26px;padding-top:14px;border-top:2px solid var(--border)"><div style="font:700 12px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--violet)">On paper</div><div class="faint" style="font-size:11.5px;margin-top:2px">The written questions they put to government: what they chase, and how they go about it.</div></div>
      ${(mp.themes||[]).length?`
      <div style="margin-top:18px">
        <div class="label">What they're pursuing · last 6 months
          <span class="tip faint" title="AI-read nightly from their last ${mp.themeN||"~30"} written questions and debate excerpts. Describes what their parliamentary activity does, not what the MP is like. Hover a theme for an example. Counts classify each item as: pressing (demanding action), probing (seeking information), constituency (local casework), supportive (friendly prompts).">AI ⓘ</span></div>
        ${mp.themes.map((t,i)=>`
          <div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border)"
               ${t.example?`title="e.g. ${esc(t.example)}"`:""}>
            <span class="mono faint" style="font-size:11px;flex-shrink:0">0${i+1}</span>
            <span style="font-size:13px;min-width:0"><b>${esc(t.subject)}</b>
              <span class="dim">&middot; ${esc(t.stance)}</span></span>
          </div>`).join("")}
        ${mp.approach?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">

      </div>`:""}
    </div>
  </div>`;
}

/* ---------- LEAGUES ---------- */
function renderLeagues(){
  const L = DATA.leagues;
  if(!L) return `<div class="empty">No league data yet. Run the backfill on GitHub.</div>`;
  const block = (title, subtitle, tipText, rows, fmt) => `
    <div class="panel">
      <div class="label"><span class="tip" title="${tipText}">${title}</span></div>
      <div class="faint" style="font-size:11px;margin:-4px 0 8px">${subtitle}</div>
      ${ (rows||[]).map((r,i)=>`
        <div class="row">
          <span class="mono faint" style="width:18px;font-size:11px">${i+1}</span>
          ${pdot(r.party)}
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px">${esc(r.name)}</span>
          <span class="mono" style="font-weight:600">${fmt(r)}</span>
        </div>`).join("") || '<div class="faint" style="font-size:12px">Awaiting data.</div>'}
    </div>`;
  return `<p class="dim" style="font-size:12.5px;max-width:760px;margin-bottom:12px">The Commons, ranked from the full public record rather than press coverage. Every table has a floor so a small sample cannot top a chart.</p><div class="grid g2">
    ${DATA.sentiment?.leagues ? `
    ${block("The attack index","Who runs hottest when taking the government on, last 3 months","Built from an MP's challenging contributions only: everything they said that opposed the government position or pushed it to go further. Each is scored for how strongly it was said (angry 3, impassioned 2, worried 1, routine 0) and this is the average, from 0 to 3. At least 10 challenging contributions are needed to qualify, so ministers drop out naturally and one outburst cannot top the table", DATA.sentiment.leagues.attack, r=>r.v.toFixed(2)+" <span class='faint' style='font-weight:400'>of 3</span>")}
    ${block("Rising voices","Whose tone has climbed most in recent months","MPs whose contributions have been getting steadily more forceful: their score over the last two active months compared with their earlier average. Only months where they spoke at least 5 times count towards the comparison", DATA.sentiment.leagues.escalators, r=>r.v+" <span class='faint' style='font-weight:400'>rise</span>")}
    ${block("The calm operators","The most level-tempered of the frequent speakers, last 3 months","The lowest scores among MPs who spoke at least 40 times in the last three months: the people who talk a lot and never raise the temperature. Deputy Speakers and whips live here by design, which is a good sign the reading works", DATA.sentiment.leagues.calm, r=>r.v.toFixed(2)+" <span class='faint' style='font-weight:400'>of 3</span>")}` : ""}
    ${block("Independence index","How often they rebel, relative to their party","Rebellions relative to their own party's average, measured this way because four rebellions in a tightly-whipped party mean far more than four in a loose one", L.independence, r=>r.v+"× party avg <span class='faint'>("+r.raw+" rebellions)</span>")}
    ${block("Chamber voice","Spoken contributions this parliament","Spoken contributions recorded in Hansard this parliament: speeches, interventions and oral answers", L.voice, r=>(r.v||0).toLocaleString()+" <span class='faint' style='font-weight:400'>contributions</span>")}
    ${block("Scrutiny volume","Written questions tabled this parliament","Written questions tabled this parliament. Ministers answer questions rather than table them, so frontbenchers rank low by design", L.scrutiny, r=>r.v+" <span class='faint' style='font-weight:400'>questions</span>")}
    ${block("Division presence","Share of votes attended","Share of all divisions voted in", L.presence, r=>r.v+"% <span class='faint' style='font-weight:400'>of votes</span>")}
  </div>
  ${L.policy ? `
  <div class="panel" style="margin-top:14px">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px">
      <div class="label">By policy area
        <span class="tip faint" title="Top askers of written questions per answering department, this parliament. Pure counts, no AI involved.">ⓘ</span></div>
      <select id="dept-pick" onchange="selDept=this.value;render()"
        style="background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--fg);font:600 12px var(--disp);max-width:100%">
        ${Object.keys(L.policy).map(d=>`<option value="${esc(d)}" ${d===selDept?"selected":""}>${esc(d)}</option>`).join("")}
      </select>
    </div>
    ${(()=>{const d=L.policy[selDept]||L.policy[Object.keys(L.policy)[0]];if(!d)return"";
      return `<div class="faint" style="font-size:11px;margin:8px 0 8px">${d.total.toLocaleString()} written questions tabled to this department this parliament</div>`+
      `<div class="label" style="margin-top:8px">Top askers &middot; written questions</div>`+
      d.top.map((r,i)=>`
      <div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border)">
        <span class="mono faint" style="font-size:11px;width:20px">${String(i+1).padStart(2,"0")}</span>
        ${pdot(r.party)}
        <span style="font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}
          <span class="faint" style="font-size:11px">· ${esc(r.seat)}</span></span>
        <span class="mono" style="font-size:12px;margin-left:auto">${r.n} <span class="faint" style="font-weight:400">questions</span></span>
      </div>`).join("")+
      ((d.speakers||[]).length?`<div class="label" style="margin-top:16px">Most active in debates
        <span class="tip faint" title="Contributions in debate sections AI-mapped to this department: Chamber and Westminster Hall, last ~6 months">ⓘ</span></div>`+
      d.speakers.map((r,i)=>`
      <div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border)">
        <span class="mono faint" style="font-size:11px;width:20px">${String(i+1).padStart(2,"0")}</span>
        ${pdot(r.party)}
        <span style="font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}
          <span class="faint" style="font-size:11px">· ${esc(r.seat)}</span></span>
        <span class="mono" style="font-size:12px;margin-left:auto">${r.n} <span class="faint" style="font-weight:400">contributions</span></span>
      </div>`).join(""):"");})()}
  </div>`:""}`;
}

async function sendContact(){
  const msg = document.getElementById("cf-msg").value.trim();
  const email = document.getElementById("cf-email").value.trim();
  const status = document.getElementById("cf-status");
  if(!msg){ status.textContent = "Write a message first."; return; }
  status.textContent = "Sending…";
  try{
    const r = await fetch(FORM_ENDPOINT, {method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({email, message: msg})});
    if(r.ok){ status.textContent = "Sent. Thank you!";
      document.getElementById("cf-msg").value = ""; }
    else status.textContent = "Something went wrong. Please try again later.";
  }catch(e){ status.textContent = "Something went wrong. Please try again later."; }
}
