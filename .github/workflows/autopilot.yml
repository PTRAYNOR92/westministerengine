name: Backfill autopilot (one click, walks backwards fortnight by fortnight)

on:
  workflow_dispatch:
    inputs:
      cursor:
        description: "Walk back from this date (YYYY-MM-DD). Leave blank to start from the oldest date already in the database."
        required: false
        default: ""
      stop_at:
        description: "Stop when reaching this date (YYYY-MM-DD)"
        required: true
        default: "2024-07-04"

permissions:
  contents: read
  actions: write

jobs:
  chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Classify one fortnight
        id: run
        run: python pipeline/history.py --auto --cursor "${{ inputs.cursor }}" --stop "${{ inputs.stop_at }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Start the next fortnight
        if: steps.run.outputs.continue == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/autopilot.yml/dispatches \
            -d '{"ref":"main","inputs":{"cursor":"${{ steps.run.outputs.cursor }}","stop_at":"${{ inputs.stop_at }}"}}'
